name: Python U-Net CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # hoặc 3.9 tùy theo bạn dùng gì

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run training script
      run: |
        python train_model_U-NET.py  # hoặc script khác bạn dùng để kiểm tra

    # (Optional) Lưu kết quả model
    - name: Upload trained model
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: path/to/saved_model_or_checkpoint/
